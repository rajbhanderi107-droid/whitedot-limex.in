services:
  - type: web
    name: whitedot-limex-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: cd server && NPM_CONFIG_PRODUCTION=false npm ci && npm run prisma:generate && npm run build && npx prisma db push && npm run seed
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://whitedotindia.in
      - key: FRONTEND_ORIGINS
        value: https://whitedotindia.in,https://www.whitedotindia.in,https://rajbhanderi107-droid.github.io,https://admin.whitedotindia.in
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      # Google admin sign-in. GOOGLE_CLIENT_ID is enough for the browser token
      # flow; GOOGLE_CLIENT_SECRET is optional for the legacy code flow.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # SMTP for password-reset emails. Secrets are set in the Render dashboard
      # (sync: false). If HOST/USER/PASS are left blank, reset links are logged
      # to the server console instead of being emailed — the flow still works.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: White Dot <no-reply@whitedotindia.in>
      # LIMEX Assistant (chat). Provider-agnostic, OpenAI-compatible endpoint.
      # Set LLM_API_KEY in the Render dashboard (sync: false). Defaults target
      # Groq's free tier. If the key is unset, the chat endpoint returns a
      # graceful "unavailable" message — the site still builds and runs.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      # AI Agents — real Claude-backed agent runs. Paste the Anthropic API key
      # in the Render dashboard (sync: false). If unset, the agent-run endpoint
      # returns a graceful 503 and the rest of the portal is unaffected.
      # ANTHROPIC_MODEL overrides the per-tier default for every agent — leave
      # blank for the defaults (strategy → claude-opus-4-8, others →
      # claude-sonnet-4-6), or set e.g. claude-haiku-4-5 to minimise cost.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      # Google Dashboard — service account credentials + property IDs.
      # Set GOOGLE_SERVICE_ACCOUNT_JSON in the Render dashboard (paste the
      # full JSON key as a single-line string). GA4 and GSC env vars can be
      # set here or in the dashboard.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GA4_PROPERTY_ID
        value: "539572382"
      - key: GSC_SITE_URL
        value: "https://whitedotindia.in/"
      # Google Search Console — OAuth2 refresh token (set in Render dashboard).
      # Generated by running: node server/save_gsc_token.cjs
      - key: GSC_OAUTH_CLIENT_ID
        sync: false
      - key: GSC_OAUTH_CLIENT_SECRET
        sync: false
      - key: GSC_OAUTH_REFRESH_TOKEN
        sync: false
      # Quota project for the GSC OAuth token. Required when the refresh token
      # belongs to a shared/default OAuth client (gcloud ADC); the searchconsole
      # API rejects calls without an x-goog-user-project header. Non-secret.
      - key: GSC_QUOTA_PROJECT
        value: "fresh-strategy-497720-q7"

      # Set this in the Render dashboard to the Supabase Session Pooler URL:
      # postgresql://postgres.yrsqtsejbvjwzegtkmkr:[PASSWORD]@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
