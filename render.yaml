services:
  - type: web
    name: whitedot-limex-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: cd server && NPM_CONFIG_PRODUCTION=false npm ci && npm run prisma:generate && npm run build
    startCommand: cd server && npx prisma db push && npm run seed && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://whitedotindia.in
      - key: FRONTEND_ORIGINS
        value: https://whitedotindia.in,https://www.whitedotindia.in,https://rajbhanderi107-droid.github.io,https://admin.whitedotindia.in
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      # SMTP for password-reset emails. Secrets are set in the Render dashboard
      # (sync: false). If HOST/USER/PASS are left blank, reset links are logged
      # to the server console instead of being emailed — the flow still works.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: White Dot <no-reply@whitedotindia.in>
      # LIMEX Assistant (chat). Provider-agnostic, OpenAI-compatible endpoint.
      # Set LLM_API_KEY in the Render dashboard (sync: false). Defaults target
      # Groq's free tier. If the key is unset, the chat endpoint returns a
      # graceful "unavailable" message — the site still builds and runs.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        fromDatabase:
          name: whitedot-limex-postgres
          property: connectionString

databases:
  - name: whitedot-limex-postgres
    databaseName: whitedot_limex
    user: whitedot_limex_user
    plan: free
    region: singapore
    postgresMajorVersion: "15"
    ipAllowList: []
