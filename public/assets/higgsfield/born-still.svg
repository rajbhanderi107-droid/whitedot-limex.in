<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="glowH" gradientUnits="userSpaceOnUse" cx="806" cy="540" r="680">
      <stop offset="0%" stop-color="#9aa893" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#9aa893" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerH" gradientUnits="userSpaceOnUse" cx="1632" cy="162" r="500">
      <stop offset="0%" stop-color="#181b19" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#181b19" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomH" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="grainH" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.96
                0 0 0 0 0.95
                0 0 0 0 0.91
                0 0 0 0.55 0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#050706"/>
  <rect width="1920" height="1080" fill="url(#cornerH)"/>
  <rect width="1920" height="1080" fill="url(#glowH)"/>

  <circle cx="672" cy="540" r="24" fill="#f5f1e8" opacity="0.22" filter="url(#bloomH)"/>
  <circle cx="672" cy="540" r="24" fill="#f5f1e8"/>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="780" y="522" fill="#f5f1e8" font-size="72" font-weight="200"
      letter-spacing="14.4">WHITE DOT</text>
    <text x="780" y="558" fill="#9aa893" font-size="14" font-weight="400"
      letter-spacing="1.96">AUTHORIZED LIMEX MARKETING &amp; SALES, INDIA</text>
    <line x1="780" y1="582" x2="1260" y2="582" stroke="#9aa893" stroke-opacity="0.18" stroke-width="0.5"/>
    <text x="780" y="612" fill="#f5f1e8" fill-opacity="0.68" font-size="20" font-weight="300"
      letter-spacing="0.8">Built from CO₂. Designed for the Planet.</text>
    <text x="780" y="648" fill="#9aa893" fill-opacity="0.45" font-size="12" font-weight="400"
      letter-spacing="0.96">whitedot-limex.in</text>
  </g>

  <rect width="1920" height="1080" filter="url(#grainH)" opacity="0.04"/>
</svg>
