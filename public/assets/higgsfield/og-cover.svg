<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="430" cy="315" r="430">
      <stop offset="0%" stop-color="#9aa893" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9aa893" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.96  0 0 0 0 0.95  0 0 0 0 0.91  0 0 0 0.55 0"/>
    </filter>
    <!-- WhiteDot emblem (from public/assets/whitedot-logo-enhanced.svg) -->
    <linearGradient id="wdTeal" x1="18" y1="20" x2="106" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E84A8"/><stop offset="0.55" stop-color="#339A90"/><stop offset="1" stop-color="#5EAD73"/>
    </linearGradient>
    <radialGradient id="wdLime" cx="50%" cy="50%" r="54%">
      <stop stop-color="#B7D946"/><stop offset="0.62" stop-color="#A8CF45"/><stop offset="1" stop-color="#8DBA35" stop-opacity="0.74"/>
    </radialGradient>
    <filter id="wdDepth" x="-24%" y="-24%" width="148%" height="148%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#050706" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#1588A6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#050706"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Emblem — centered at (430,315), ~118px -->
  <g transform="translate(371,256) scale(0.922)">
    <g filter="url(#wdDepth)">
      <g fill="none" stroke="url(#wdTeal)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <path d="M62 22 C57 37 73 35 68 51"/><path d="M44 35 C34 45 48 50 40 62"/><path d="M24 61 C38 60 35 74 50 72"/><path d="M40 94 C44 82 54 87 52 73"/><path d="M65 107 C65 94 55 94 58 82"/><path d="M86 94 C78 85 85 80 99 84"/><path d="M100 65 C86 67 87 53 97 48"/><path d="M82 29 C78 43 93 42 92 56"/>
      </g>
      <g fill="#0E84A8">
        <circle cx="46" cy="18" r="6.1"/><circle cx="19" cy="53" r="6.1"/><circle cx="21" cy="82" r="6.7"/><circle cx="46" cy="111" r="6.3"/><circle cx="82" cy="112" r="6.5"/>
      </g>
      <g fill="#5EAD73">
        <circle cx="45" cy="55" r="6.2"/><circle cx="78" cy="55" r="6.2"/><circle cx="51" cy="82" r="6.4"/><circle cx="78" cy="82" r="6.4"/>
      </g>
      <circle cx="64" cy="64" r="10.6" fill="url(#wdLime)"/>
      <path d="M45 35 C52 22 75 22 83 35" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity="0.2"/>
    </g>
  </g>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="540" y="298" fill="#f5f1e8" font-size="52" font-weight="300" letter-spacing="9.36">WHITE DOT</text>
    <text x="540" y="328" fill="#9aa893" font-size="13" font-weight="400" letter-spacing="1.56">AUTHORIZED LIMEX MARKETING &amp; SALES</text>
    <line x1="540" y1="348" x2="860" y2="348" stroke="#9aa893" stroke-opacity="0.18" stroke-width="0.5"/>
    <text x="540" y="374" fill="#f5f1e8" fill-opacity="0.72" font-size="16" font-weight="300" letter-spacing="0.64">Built from limestone. Engineered for industry.</text>
  </g>

  <rect width="1200" height="630" filter="url(#grain)" opacity="0.045"/>
</svg>
