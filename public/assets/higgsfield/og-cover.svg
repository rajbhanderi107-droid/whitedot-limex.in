<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="456" cy="327.6" r="420">
      <stop offset="0%" stop-color="#9aa893" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#9aa893" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.96
                0 0 0 0 0.95
                0 0 0 0 0.91
                0 0 0 0.55 0"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#050706"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- The grain — one grain of limestone, luminous -->
  <circle cx="432" cy="315" r="18" fill="#f5f1e8" opacity="0.28" filter="url(#bloom)"/>
  <circle cx="432" cy="315" r="18" fill="#f5f1e8"/>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="516" y="298" fill="#f5f1e8" font-size="52" font-weight="300"
      letter-spacing="9.36">WHITE DOT</text>
    <text x="516" y="328" fill="#9aa893" font-size="13" font-weight="400"
      letter-spacing="1.56">AUTHORIZED LIMEX MARKETING &amp; SALES</text>
    <line x1="516" y1="348" x2="836" y2="348" stroke="#9aa893" stroke-opacity="0.18" stroke-width="0.5"/>
    <text x="516" y="374" fill="#f5f1e8" fill-opacity="0.72" font-size="16" font-weight="300"
      letter-spacing="0.64">Built from CO₂. Designed for the Planet.</text>
  </g>

  <rect width="1200" height="630" filter="url(#grain)" opacity="0.045"/>
</svg>
