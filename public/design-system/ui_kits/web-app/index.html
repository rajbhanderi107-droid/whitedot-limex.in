<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>White Dot Procurement Portal</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/whitedot-symbol.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Icon.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="TopBar.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="TrialRequestModal.jsx"></script>
  <script type="text/babel" src="Authorization.jsx"></script>
  <script type="text/babel" src="SpecLibrary.jsx"></script>

  <script type="text/babel">
    const initialTrials = [
      { id: "WD-289", product: "Spunbond nonwoven fabric", company: "Anand Polyfab", region: "Surat", volume: "500 t / yr", status: "active", statusLabel: "Trial samples shipped" },
      { id: "WD-284", product: "Backlit film 200μm", company: "Lumen Signage", region: "Ahmedabad", volume: "12,000 m² / yr", status: "review", statusLabel: "Material fit review" },
      { id: "WD-281", product: "LimeAir garbage bag", company: "Civic Procurement, Jaipur", region: "Rajasthan", volume: "240,000 units", status: "shipped", statusLabel: "Pellet shipped" },
      { id: "WD-274", product: "Sheet, file folders", company: "Reyansh Stationery", region: "Daman", volume: "60 t / yr", status: "review", statusLabel: "Spec validation" },
      { id: "WD-267", product: "Injection mould tray", company: "Sayaji FMCG", region: "Vadodara", volume: "1.2M units / yr", status: "active", statusLabel: "Pilot run #2" },
      { id: "WD-251", product: "Sealant film", company: "Surya Packing", region: "Rajkot", volume: "120,000 m² / yr", status: "archived", statusLabel: "Closed — paused" },
    ];

    const App = () => {
      const [view, setView] = React.useState("dashboard");
      const [trials, setTrials] = React.useState(initialTrials);
      const [modalOpen, setModalOpen] = React.useState(false);

      const titles = {
        dashboard:   { crumb: "Workspace",    title: "Dashboard" },
        trials:      { crumb: "Workspace",    title: "Trial requests" },
        specs:       { crumb: "Workspace",    title: "Spec library" },
        applications:{ crumb: "Workspace",    title: "Applications" },
        auth:        { crumb: "Supply",       title: "Authorization chain" },
        territory:   { crumb: "Supply",       title: "Territory" },
        contact:     { crumb: "Supply",       title: "Contact" },
      };
      const t = titles[view] || titles.dashboard;

      const handleSubmit = (req) => {
        setTrials((prev) => [req, ...prev]);
      };

      let content;
      if (view === "dashboard" || view === "trials") {
        content = <window.Dashboard trials={trials}/>;
      } else if (view === "specs" || view === "applications") {
        content = <window.SpecLibrary/>;
      } else {
        content = <window.Authorization/>;
      }

      return (
        <div className="shell">
          <window.Sidebar active={view} onNav={setView}/>
          <main className="main">
            <window.TopBar crumb={t.crumb} title={t.title} onNew={() => setModalOpen(true)}/>
            {content}
          </main>
          <window.TrialRequestModal open={modalOpen} onClose={() => setModalOpen(false)} onSubmit={handleSubmit}/>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
