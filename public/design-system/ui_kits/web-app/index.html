<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=../../index.html">
  <title>White Dot Website Design System</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/whitedot-symbol.svg">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--wd-bg);
      color: var(--wd-text);
      font-family: var(--wd-font-sans);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at 50% 20%, rgba(154, 168, 147, 0.16), transparent 34%),
        linear-gradient(160deg, #0d0f0e, #131611 48%, #0a0c0b);
    }
    main {
      max-width: 560px;
      border: 1px solid var(--wd-line);
      border-radius: var(--wd-r-xl);
      background: var(--wd-surface);
      padding: 2rem;
      box-shadow: var(--wd-shadow-card);
    }
    .kicker {
      margin: 0 0 0.8rem;
      color: var(--wd-accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 1.4rem;
      color: var(--wd-muted);
      line-height: 1.65;
    }
    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 0 1rem;
      border-radius: var(--wd-r-pill);
      background: linear-gradient(120deg, var(--wd-accent), var(--wd-cream), var(--wd-accent));
      color: var(--wd-on-accent);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Website-only system</p>
    <h1>Portal mock removed.</h1>
    <p>White Dot is a marketing website, not an app. The current design-system bundle contains the website kit only.</p>
    <a href="../../index.html">Open design system</a>
  </main>
</body>
</html>
