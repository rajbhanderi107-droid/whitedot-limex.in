# /etc/nginx/sites-available/whitedotindia.in
# Source of truth lives in the repo at deploy/nginx/whitedotindia.in.conf —
# the Deploy Frontend workflow installs it (nginx -t validated, rolled back on failure).
# Serves the built React/Vite frontend from /var/www/whitedot-frontend
server {
    listen 80;
    server_name whitedotindia.in www.whitedotindia.in;
    return 301 https://whitedotindia.in$request_uri;
}
server {
    listen 443 ssl;
    server_name www.whitedotindia.in;
    ssl_certificate /etc/letsencrypt/live/whitedotindia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whitedotindia.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://whitedotindia.in$request_uri;
}
server {
    listen 443 ssl;
    server_name whitedotindia.in;
    ssl_certificate /etc/letsencrypt/live/whitedotindia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whitedotindia.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/whitedot-frontend;
    index index.html;

    # index.html must always revalidate so every deploy is visible immediately
    # (hashed asset filenames change each build; a cached index.html would
    # reference deleted bundles and show a stale or broken page)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Non-hashed HTML/JSON (case-study pages, specs data) revalidate too
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Serve static assets with long cache (filenames are content-hashed)
    location ~* \.(js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|webp|mp4|avif|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React router — all unmatched paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    client_max_body_size 10M;
}
