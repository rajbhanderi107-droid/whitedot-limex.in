<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="White Dot LLP supports authorized LIMEX material marketing and sales with clear guidance for plastic replacement, product trials, and industrial adoption."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/whitedot-logo-enhanced.svg" />
    <title>White Dot LLP | Authorized LIMEX Marketing and Sales</title>

    <!-- Social / Open Graph. og:image points at the Higgsfield drop slot
         (public/assets/higgsfield/og-cover.jpg) — add the file to activate. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rajbhanderi107-droid.github.io/whitedot-limex.in/" />
    <meta property="og:title" content="White Dot LLP | Authorized LIMEX Marketing and Sales" />
    <meta
      property="og:description"
      content="Authorized LIMEX material marketing and sales — plastic replacement, product trials, and industrial adoption. Built from CO₂. Designed for the Planet."
    />
    <meta property="og:image" content="%BASE_URL%assets/higgsfield/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="White Dot LLP | Authorized LIMEX Marketing and Sales" />
    <meta
      name="twitter:description"
      content="Authorized LIMEX material marketing and sales — plastic replacement, product trials, and industrial adoption."
    />
    <meta name="twitter:image" content="%BASE_URL%assets/higgsfield/og-cover.jpg" />
    <!-- Brand type system — Satoshi + Boska (Indian Type Foundry), JetBrains Mono.
         See white-dot-design-system. Production: self-host .woff2, swap to @font-face. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&f[]=satoshi-italic@400,500,700&f[]=boska@400,500,700,900&f[]=boska-italic@400,500,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap"
    />
    <!-- AGGREGATION-WD-BEGIN critical-css -->
    <style>
      .agg-wd-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#181b19;transition:opacity .4s ease}
      .agg-wd-loader[data-done]{opacity:0;pointer-events:none}
      .agg-wd-dot{width:10px;height:10px;border-radius:50%;background:#9aa893;box-shadow:0 0 18px rgba(154,168,147,.55);animation:aggBreathe 1.4s ease-in-out infinite}
      .agg-wd-ring{position:absolute;width:28px;height:28px}
      .agg-wd-ring circle{fill:none;stroke:#9aa893;stroke-width:1;stroke-dasharray:75.4;stroke-dashoffset:18;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;animation:aggSpin 1.2s linear infinite}
      .agg-wd-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      @keyframes aggBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      @keyframes aggSpin{to{transform:rotate(310deg)}}
      @media(prefers-reduced-motion:reduce){.agg-wd-dot{animation:none}}
      @media(max-width:380px){.agg-wd-dot{width:8px;height:8px}.agg-wd-ring{width:24px;height:24px}}
    </style>
    <!-- AGGREGATION-WD-END critical-css -->
  </head>
  <body>
    <!-- AGGREGATION-WD-BEGIN inline-loader -->
    <div class="agg-wd-loader" id="agg-wd-loader" role="status">
      <svg class="agg-wd-ring" viewBox="0 0 28 28" aria-hidden="true">
        <circle id="agg-wd-ring-track" cx="14" cy="14" r="12" opacity="0.12"/>
        <circle id="agg-wd-ring-fill" cx="14" cy="14" r="12"/>
      </svg>
      <div class="agg-wd-dot" aria-hidden="true"></div>
      <span class="agg-wd-sr">Loading White Dot — LIMEX Marketing &amp; Sales</span>
    </div>
    <!-- AGGREGATION-WD-END inline-loader -->
    <!-- Admin routes skip the loader entirely — it only exists for the public site -->
    <script>if(location.hostname==="admin.whitedotindia.in"&&location.hash.indexOf("#/admin")===0){var l=document.getElementById("agg-wd-loader");if(l)l.remove()}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
