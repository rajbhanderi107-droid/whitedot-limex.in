    <style>
      .agg-wd-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#181b19;transition:opacity .4s ease}

      .agg-wd-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      @keyframes aggBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      @keyframes aggSpin{to{transform:rotate(310deg)}}
      @media(prefers-reduced-motion:reduce){.agg-wd-dot{animation:none}}
      @media(max-width:380px){.agg-wd-dot{width:8px;height:8px}.agg-wd-ring{width:24px;height:24px}}
    </style>
