name: Inspect VPS nginx config

on:
  workflow_dispatch:

concurrency:
  group: inspect-vps-nginx
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dump nginx server blocks (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            echo "=== nginx -t ==="
            nginx -t
            echo "=== nginx -V ==="
            nginx -V 2>&1 | tr ' ' '\n' | grep -E 'brotli|gzip|with-http' | head -20 || true
            echo "=== files under /etc/nginx ==="
            find /etc/nginx -maxdepth 3 -type f -name '*.conf' -o -maxdepth 3 -type l | sort
            echo "=== sites-enabled ==="
            ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
            echo "=== conf.d ==="
            ls -la /etc/nginx/conf.d/ 2>/dev/null || true
            echo "=== every server block serving whitedot-frontend ==="
            grep -rln 'whitedot-frontend' /etc/nginx/ || true
            echo "=== full content of matching configs ==="
            for f in $(grep -rln 'whitedot-frontend' /etc/nginx/ 2>/dev/null); do
              echo "----- $f -----"
              cat "$f"
            done
            echo "=== http-level gzip / include lines ==="
            grep -nE 'gzip|brotli|include|types_hash|default_type' /etc/nginx/nginx.conf || true
