name: VPS Network Diagnostics

on:
  workflow_dispatch:
    inputs:
      source_ip:
        description: "Client public IP to watch"
        required: true
      duration:
        description: "Capture duration in seconds"
        required: false
        default: "25"

concurrency:
  group: vps-network-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Watch VPS traffic for source IP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -e
            SOURCE_IP='${{ inputs.source_ip }}'
            DURATION='${{ inputs.duration }}'

            echo "=== host ==="
            hostname
            date -u
            echo "Watching for ${SOURCE_IP} for ${DURATION}s"

            echo "=== public web state ==="
            ss -ltnp | grep -E ':(80|443)\b' || true
            iptables -S INPUT || true
            curl -kfsS -o /dev/null -w 'local_https_status=%{http_code}\n' \
              -H 'Host: whitedotindia.in' https://127.0.0.1/

            echo "=== recent nginx access lines for source IP ==="
            find /var/log/nginx -type f -name '*access*' -maxdepth 1 -print -exec sh -c 'grep -h "$1" "$2" | tail -n 20 || true' sh "$SOURCE_IP" {} \;

            echo "=== packet capture ==="
            if command -v tcpdump >/dev/null 2>&1; then
              timeout "${DURATION}" tcpdump -nni any "host ${SOURCE_IP} and (tcp port 80 or tcp port 443 or tcp port 22)" || true
            else
              echo "tcpdump not installed"
            fi

            echo "=== recent nginx access lines after capture ==="
            find /var/log/nginx -type f -name '*access*' -maxdepth 1 -print -exec sh -c 'grep -h "$1" "$2" | tail -n 20 || true' sh "$SOURCE_IP" {} \;
