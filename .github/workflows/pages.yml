name: Deploy frontend to Hostinger VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy-frontend"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_API_URL: https://api.whitedotindia.in
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Deploy to VPS via rsync
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/"
          target: "/var/www/whitedot-frontend-new"
          strip_components: 1

      - name: Swap and reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            rm -rf /var/www/whitedot-frontend
            mv /var/www/whitedot-frontend-new /var/www/whitedot-frontend
            nginx -t && systemctl reload nginx
            echo "Frontend deployed: $(date)"
