name: Verify four book source folders
on:
  pull_request:
    paths:
      - 'src/admin/routebook/**'
      - 'src/books/**'
      - 'tests/**'
      - '.github/workflows/book-folders-check.yml'
jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/source-folders.spec.ts tests/books.spec.ts tests/bookapps.spec.ts --project=chromium --workers=2 --reporter=line
