name: Preview deploy (Cloudflare Pages)

# Builds the site for every pull request and pushes it to Cloudflare Pages,
# giving each PR / branch its own shareable preview URL. Production
# (whitedotindia.in) is untouched — that is still handled by pages.yml on main.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://whitedot-limex-backend.onrender.com
      # Mapped here so steps can detect whether Cloudflare is configured yet.
      # (secrets can't be referenced directly in a step `if:`, env can.)
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Skip notice (Cloudflare not configured)
        if: env.CF_API_TOKEN == ''
        run: |
          echo "::notice::Cloudflare secrets not set — skipping preview deploy."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/PREVIEW_DEPLOYS.md) to enable preview URLs."

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=whitedot-limex
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const marker = '<!-- whitedot-preview -->';
            const body = `${marker}\n### 🔍 Preview is live\n\nYour work-in-progress is deployed here:\n\n**${url}**\n\nThis link updates automatically every time you push to this branch.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
