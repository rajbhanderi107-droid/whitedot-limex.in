name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & build
        env:
          VITE_API_URL: https://api.whitedotindia.in
        run: |
          npm ci
          npm run build

      - name: Upload dist to Hostinger VPS staging dir
        id: upload_primary
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/"
          target: "/var/www/whitedot-frontend-new"
          strip_components: 1
          timeout: 60s
          command_timeout: 10m
          rm: true

      - name: Retry Hostinger upload after connection timeout
        if: steps.upload_primary.outcome == 'failure'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/"
          target: "/var/www/whitedot-frontend-new"
          strip_components: 1
          timeout: 60s
          command_timeout: 10m
          rm: true

      - name: Atomic swap + nginx reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            rm -rf /var/www/whitedot-frontend
            mv /var/www/whitedot-frontend-new /var/www/whitedot-frontend
            nginx -t && systemctl reload nginx
            echo "Deployed: $(date)"
