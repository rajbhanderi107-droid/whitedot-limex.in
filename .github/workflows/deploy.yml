name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & build
        env:
          VITE_API_URL: https://api.whitedotindia.in
        run: |
          npm ci
          npm run build

      - name: Configure VPS SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/whitedot_deploy
          chmod 600 ~/.ssh/whitedot_deploy
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts

      - name: Prepare atomic VPS staging dir
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/whitedot_deploy -o ConnectTimeout=30 root@"$VPS_HOST" '
            set -e
            command -v rsync >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq rsync)
            rm -rf /var/www/whitedot-frontend-new
            mkdir -p /var/www/whitedot-frontend-new
            if [ -d /var/www/whitedot-frontend ]; then
              cp -al /var/www/whitedot-frontend/. /var/www/whitedot-frontend-new/
            fi
          '

      - name: Incrementally sync changed frontend files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          for attempt in 1 2; do
            rsync -a --checksum --delete --delay-updates --partial --stats \
              -e "ssh -i ~/.ssh/whitedot_deploy -o ConnectTimeout=30" \
              dist/ root@"$VPS_HOST":/var/www/whitedot-frontend-new/ && exit 0
            sleep 5
          done
          exit 1

      - name: Atomic swap + nginx reload
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/whitedot_deploy -o ConnectTimeout=30 root@"$VPS_HOST" '
            set -e
            test -s /var/www/whitedot-frontend-new/index.html
            nginx -t
            rm -rf /var/www/whitedot-frontend-previous
            if [ -d /var/www/whitedot-frontend ]; then
              mv /var/www/whitedot-frontend /var/www/whitedot-frontend-previous
            fi
            mv /var/www/whitedot-frontend-new /var/www/whitedot-frontend
            if ! systemctl reload nginx; then
              rm -rf /var/www/whitedot-frontend
              mv /var/www/whitedot-frontend-previous /var/www/whitedot-frontend
              systemctl reload nginx || true
              exit 1
            fi
            rm -rf /var/www/whitedot-frontend-previous
            echo "Deployed: $(date)"
          '
