name: Deploy frontend (S3 + CloudFront)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: ""
  VITE_API_URL: https://api.whitedotindia.in

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover deployment bucket
        id: bucket
        run: |
          set -euo pipefail
          buckets=$(aws s3api list-buckets --query 'Buckets[].Name' --output text)
          echo "Available buckets: ${buckets}"
          bucket=$(printf '%s\n' ${buckets} | grep -E 'whitedot|white-dot|limex' | head -n 1 || true)
          if [ -z "$bucket" ]; then
            echo "::error::No WhiteDot/LIMEX S3 bucket found in this AWS account."
            exit 1
          fi
          echo "bucket=${bucket}" >> "$GITHUB_OUTPUT"
          echo "Using bucket: ${bucket}"

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ steps.bucket.outputs.bucket }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Print CloudFront domain
        run: |
          aws cloudfront get-distribution \
            --id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --query 'Distribution.DomainName' \
            --output text
