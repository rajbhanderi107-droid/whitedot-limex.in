name: Deploy frontend (S3 + CloudFront)

on:
  # Manual-only until AWS is bootstrapped (OIDC role AWS_DEPLOY_ROLE_ARN, S3
  # bucket whitedot-frontend, CloudFront distro + CLOUDFRONT_DISTRIBUTION_ID).
  # The site currently ships via GitHub Pages (.github/workflows/pages.yml).
  # To cut over to AWS: set the secrets, uncomment the push block, then disable Pages.
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: whitedot-frontend
  # Backend API base baked into the build. Single var overrides all in-code fallbacks.
  VITE_API_URL: https://api.whitedotindia.in

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ env.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
