name: VPS Diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Show nginx site config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== sites-enabled ==="
            ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
            echo "=== conf.d ==="
            ls -la /etc/nginx/conf.d/ 2>/dev/null || true
            for f in $(grep -rl "whitedot-frontend" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | sort -u); do
              echo "=== FILE: $f ==="
              cat "$f"
            done
