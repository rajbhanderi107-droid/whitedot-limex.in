name: Lighthouse CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lighthouse-ci:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          # Lighthouse serves the production build from localhost, so the
          # site's call to the real API is cross-origin and can only fail
          # CORS — a console error about this runner, not about the page.
          # Blocking it at the network layer measures the site instead of the
          # origin mismatch, and the page is built to survive the API being
          # unreachable, which is exactly what a blocked request exercises.
          lhci collect --collect.settings.blockedUrlPatterns="https://api.whitedotindia.in/*"
          lhci assert
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # A category score on its own ("best-practices 0.93") says nothing about
      # what to fix. This names the audits, in the log, next to the failure.
      - name: Explain the scores
        if: always()
        run: node scripts/lighthouse-summary.mjs

      # Keep the report even when the assertions fail — that is exactly when
      # someone needs to see which audit dropped the score.
      - name: Upload the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: warn
          # .lighthouseci starts with a dot, and upload-artifact skips hidden
          # files by default — which is why every report so far uploaded
          # nothing at all.
          include-hidden-files: true
