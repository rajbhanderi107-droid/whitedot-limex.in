name: Sync TBM news feed

on:
  schedule:
    # Refresh TBM news every 3 hours. A changed feed is committed to main,
    # which triggers the existing GitHub Pages deployment workflow.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tbm-news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync TBM news
        run: npm run sync:tbm-news

      - name: Commit updated feed
        run: |
          if git diff --quiet -- public/data/tbm-news.json; then
            echo "TBM news feed is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tbm-news.json
          git commit -m "chore: sync TBM news feed"
          git push
