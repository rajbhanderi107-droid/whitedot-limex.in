name: Backend Inspect (read-only)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: SSH discover backend layout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "===== docker ps ====="
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}' || true
            echo ""
            echo "===== containers on :4000 ====="
            docker ps --filter "publish=4000" --format '{{.Names}}' || true
            echo ""
            echo "===== compose files ====="
            ls -la /root/*compose* /opt/**/*compose* /srv/**/*compose* 2>/dev/null || true
            find /root /opt /srv -maxdepth 3 -iname "docker-compose*.y*ml" 2>/dev/null | head -20 || true
            echo ""
            echo "===== backend container inspect (mounts + workdir) ====="
            for c in $(docker ps --format '{{.Names}}'); do
              PORTS=$(docker port "$c" 2>/dev/null)
              if echo "$PORTS" | grep -q 4000; then
                echo "--- container: $c ---"
                echo "ports: $PORTS"
                echo "image:"
                docker inspect -f '{{.Config.Image}}' "$c"
                echo "workdir:"
                docker inspect -f '{{.Config.WorkingDir}}' "$c"
                echo "mounts (host -> container):"
                docker inspect -f '{{range .Mounts}}{{.Source}} -> {{.Destination}} ({{.Type}}){{println}}{{end}}' "$c"
                echo "cmd/entrypoint:"
                docker inspect -f 'ENTRYPOINT={{json .Config.Entrypoint}} CMD={{json .Config.Cmd}}' "$c"
                echo "compose labels:"
                docker inspect -f '{{index .Config.Labels "com.docker.compose.project.config_files"}}  | workdir={{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$c"
              fi
            done
            echo ""
            echo "===== likely backend source dirs ====="
            find /root /opt /srv /var/www -maxdepth 4 -type d -name dist -path "*server*" 2>/dev/null | head -20 || true
            find /root /opt /srv /var/www -maxdepth 4 -iname "caseStudy.controller.js" 2>/dev/null | head -20 || true
            echo "===== done ====="
